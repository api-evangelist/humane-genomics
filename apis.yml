name: Humane Genomics
description: Humane Genomics Inc is a New York City biotechnology company engineering oncolytic RNA
  viruses to selectively target and destroy cancer cells. Using a first-principle, computer-aided design
  approach built on Vesicular Stomatitis Virus (VSV) with aptazyme-controlled selective replication, the
  company develops precision viral therapies; its lead candidate targets pediatric liver cancer
  (hepatoblastoma). Backed by Union Square Ventures, Humane Genomics operates from Alexandria LaunchLabs
  and partners with Genezen for cGMP manufacturing. The company publishes no public API or developer
  surface; this API Evangelist profile tracks it as a portfolio-company lead.
